<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Materials</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/table.css') }}">

</head>

<body>

  <nav>
    <a href="{{ url_for('sales') }}">View Sales</a>
    <a href="{{ url_for('print_view') }}">Print Page</a>
  </nav>


  <div class="form-container">
    <h1>Add Materials</h1>
    <form id="material-form">
      <div>
        <label for="material_name">Material Name</label>
        <select id="material_name" name="material_name" class="input-field" required>

        </select>
      </div>

      <div>
        <label for="stock_amount">Stock Amount</label>
        <input type="number" id="stock_amount" name="stock_amount" class="input-field" step="any" />
      </div>


      <div>
        <label for="color">Color</label>
        <select id="color" name="color" class="input-field" required>

        </select>
      </div>

      <div>
        <label for="price_per_kg">Price per Kg</label>
        <input type="number" id="price_per_kg" name="price_per_kg" class="input-field" step="any" required />
      </div>

      <button type="submit" class="submit-btn">Add Material</button>
    </form>
  </div>
  <div class="material-form">
    <div class="filters">
      <label for="filterMaterial">Filter by Material Name:</label>
      <input type="text" id="filterMaterial" placeholder="Enter name">

      <label for="filterColor">Filter by Material Color:</label>
      <input type="text" id="filterColor" placeholder="Enter color">
    </div>

    <div id="alertBox"></div>
    <table id="materialTable">
      <thead>
        <tr>
          <th>Material Name</th>
          <th>Cost per Kg</th>
          <th>Stock Amount</th>
          <th>Material Color</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be dynamically populated here -->
      </tbody>
    </table>
  </div>


  <script src="{{ url_for('static', filename='scripts/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/materials.js') }}"></script>
  <script src="{{ url_for('static', filename='colors.js') }}"></script>
</body>

</html>
