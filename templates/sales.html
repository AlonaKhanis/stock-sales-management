<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/table.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/edit.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <title>Sales</title>
</head>

<body>
  <div class="mini_material-form">
    <label>Total Material cost:</label>
    <span id="total-cost"></span><br></br>
    <label>Total Revenue:</label>
    <span id="total-sale"></span><br></br>
    <label>Total Profit:</label>
    <span id="total-profit"></span><br></br>
  </div>
  <div class="material-form">
    <div class="filters">
      <label for="filterModel">Filter by Model Name:</label>
      <input type="text" id="filterModel" placeholder="">


      <label for="filterMonth">Filter by Month:</label>
      <select id="filterMonth">
        <option value="">Select Month</option>

      </select>

      <label for="filterYear">Filter by Year:</label>
      <select id="filterYear">
        <option value="">Select Year</option>

      </select>
    </div>
    <div id="alertBox"></div>
    <table id="materialTable">
      <thead>
        <tr>
          <th>Model Name</th>
          <th>Customer Name</th>
          <th>Model Material Cost</th>
          <th>Total Material Use</th>
          <th>Selling Price</th>
          <th>Print Time</th>
          <th>Profit Amount</th>
          <th>Sale Date</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be dynamically populated here -->
      </tbody>

    </table>
    <!-- Modal (for editing sale) -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Edit Sale</h2>
        <form id="editForm">
          <label for="editModel">Model Name:</label>
          <input type="text" id="editModel" name="model_name" required><br><br>

          <label for="editCustomer">Customer Name:</label>
          <input type="text" id="editCustomer" name="customer_name" required><br><br>

          <label for="editPrice">Selling Price:</label>
          <input type="number" id="editPrice" name="selling_price" step="0.01" required><br><br>

          <button type="submit">Save</button>
        </form>
      </div>
    </div>

  </div>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Choose Action</h2>
      <button onclick="openEditModal()">Edit</button>
      <button onclick="openDeleteModal()">Delete</button>
    </div>
  </div>
  <nav>
    <a href="{{ url_for('add_material') }}">Add Materials</a>
    <a href="{{ url_for('print') }}">Print Page</a>
  </nav>

  <script src="{{ url_for('static', filename='scripts/sales.js') }}"></script>
  <script src="{{ url_for('static', filename='scripts/utils.js') }}"></script>

</body>

</html>
